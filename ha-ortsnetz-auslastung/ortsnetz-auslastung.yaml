alias: "Projekt: ortsnetz-auslastung.de"
description: |
  Sendet Daten an Projekt ortsnetz-auslastung.de über eine einfache 
  Homeassistant Automatisierung

# Zentrale Konfiguration: hier einmalig die eigenen Entity-Namen eintragen,
# alle Aktionen unten verwenden diese Variablen.
variables:
  # Entity Namen entsprechend den tatsächlichen anpassen.
  # Ohne Frequenzsensor: Zeile "frequency" hier UND Zeile "grid_frequency_hz"
  # im Payload (Schritt 2) entfernen.
  sensors:
    frequency: sensor.ksem_netzfrequenz
    l1_voltage: sensor.ksem_l1_voltage
    l2_voltage: sensor.ksem_l2_voltage
    l3_voltage: sensor.ksem_l3_voltage
  # Zone, aus der die Orts-Koordinaten gelesen werden
  location_zone: zone.home

triggers:
  # Zeit-gesteuerter Auslöser, standard: alle 5 Minuten
  - minutes: /5
    trigger: time_pattern

actions:

  # 1. aktualisiert Entities durch diesen Automatismus, falls diese "gepolled" 
  # werden (z.B. Modbus); existiert ein eigener Zeitplan zur Aktualisierung, 
  # kann die Aktion entfallen bzw. entfernt werden
  - action: homeassistant.update_entity
    metadata: {}
    data:
      # Liste der Entity-Namen aus der zentralen Konfiguration (variables: sensors)
      entity_id: "{{ sensors.values() | list }}"

  # 2. Baut aus den Entities den API Payload für die Schnittstelle
  # für ortsnetz-auslastung.de zusammen und parkt dieser in einer 
  # Variable "json_payload"
  - variables:
      json_payload:
        # Aktuelle Zeit, ISO formatiert
        observed_at: "{{ now().isoformat() }}"

        # Entity Namen kommen aus der zentralen Konfiguration (variables: sensors)
        grid_frequency_hz: "{{ states(sensors.frequency) }}"
        l1_v: "{{ states(sensors.l1_voltage) }}"
        l2_v: "{{ states(sensors.l2_voltage) }}"
        l3_v: "{{ states(sensors.l3_voltage) }}"

        # Orts-Koordinaten aus der Homeassistant Konfiguration
        latitude: "{{ state_attr(location_zone, 'latitude') }}"
        longitude: "{{ state_attr(location_zone, 'longitude') }}"

        ## Optional: installierte kwp
        # plant_capacity_kwp: 8.0
        ## Optional: vorhergesagter Tagesgesamtertrag in kWh
        # pv_forecast_kwh: "{{ states('sensor.solar_pv_forecast_today')}}"
        ## Optional: Model Name des Smart Meters
        # smartmeter_model: "Kostal Smart Energy Meter G1"
  
  # 3. Schreibt Payload ins Log, fürs Debugging (nicht aktiviert)
  - action: system_log.write
    enabled: false
    data:
      level: debug
      message: "Daten für ortsnetz-auslastung.de: {{ json_payload | to_json }}"

  # 4. Sendet nur, wenn alle Messwerte numerisch sind. Ist ein Sensor "unknown",
  # "unavailable" oder nicht vorhanden, wird eine Warnung ins System Log
  # geschrieben und die Automation abgebrochen, statt einen Request zu senden,
  # den die API mit 422 ablehnen würde.
  - alias: "Nur senden, wenn alle Messwerte numerisch sind"
    if:
      - condition: template
        value_template: >-
          {{ sensors.values() | map('states') | reject('is_number') | list
          | count > 0 }}
    then:
      - action: system_log.write
        metadata: {}
        data:
          level: warning
          message: >-
            ortsnetz-auslastung.de: nicht gesendet, nicht alle Messwerte numerisch:
            {% for key, entity in sensors.items() %}{{ entity }}={{ states(entity) }}{{ ', ' if not loop.last }}{% endfor %}
      - stop: "Messwerte nicht numerisch"

  # 5. Sendet Payload an "rest_command" Integration
  - action: rest_command.ortsnetz_auslastung_de
    data:
      payload: |
        {{ json_payload | to_json }}
    enabled: true
    # Response wird in Variable "post_response" geparkt
    response_variable: post_response

  # 6. Triggert Event "ortsnetz_api_response" zur Rückspielung der Response-
  # Daten als Sensoren
  - event: ortsnetz_api_response
    event_data:
      http_status: '{{ post_response.status | default(0) }}'
      response: '{{ post_response.content | default({}, true) | to_json }}'

  # 7. Status des Response auswerten und Fehlermeldung, falls etwas nicht stimmt
  - if:
      - condition: template
        value_template: >-
          {{ post_response['status'] >= 200 and post_response['status'] < 300 
          }}
    then:
      # Falls OK: Log in System Log
      - action: system_log.write
        metadata: {}
        data:
          level: debug
          message: Update an ortsnetz-auslastung.de OK
    else:
      # im Fehlerfall: persistente Nachricht schreiben
      - action: persistent_notification.create
        metadata: {}
        data:
          message: >-
            Fehler bei Aktualisierung ortsnetz-auslastung.de: {{ post_response | to_json }}
mode: single
